<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Tidemark social card (1200×630)</title>
<style>
@font-face { font-family: "Inter"; font-weight: 100 900; src: url("../../public/assets/fonts/inter-latin.woff2") format("woff2-variations"); }
html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
body { position: relative; background: #0e3a47; font-family: "Inter", system-ui, sans-serif; color: #eaf2f2; -webkit-font-smoothing: antialiased; }
.glow { position: absolute; inset: 0; background: radial-gradient(900px 520px at 85% 110%, rgba(8, 145, 160, .38), transparent 70%), radial-gradient(700px 400px at 0% 0%, rgba(7, 22, 27, .55), transparent 70%); }
.contours { position: absolute; inset: 0; background: url("pattern/contours-dark.svg") center / 1500px auto no-repeat; opacity: 1; }
.logo { position: absolute; left: 72px; top: 70px; height: 40px; }
h1 { position: absolute; left: 72px; top: 206px; margin: 0; font-size: 92px; line-height: 1.02; font-weight: 650; letter-spacing: -0.035em; width: 900px; }
h1 em { font-style: normal; color: #f5a524; }
p { position: absolute; left: 72px; bottom: 138px; margin: 0; font-size: 30px; line-height: 1.4; color: #b3c4c8; width: 1056px; font-weight: 450; }
.pills { position: absolute; left: 72px; bottom: 64px; display: flex; gap: 10px; }
.pills span { border: 1.5px solid rgba(234, 242, 242, .28); border-radius: 999px; padding: 8px 16px; font-size: 20px; color: #eaf2f2; font-weight: 500; }
</style></head>
<body><div class="glow"></div><div class="contours"></div>
<img class="logo" src="logo/tidemark-horizontal-white.svg" alt="tidemark">
<h1>Measure the <em>tide</em>,<br>not the footprints.</h1>
<p>Privacy-first web analytics that runs on any PHP host — or on ours.</p>
<div class="pills"><span>No cookies</span><span>No IPs stored</span></div>
</body></html>
