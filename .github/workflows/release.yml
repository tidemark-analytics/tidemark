name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to build (e.g. 0.8.1) — builds the zip as an artifact only
        required: true

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, zip, fileinfo
          coverage: none
          tools: composer:v2

      - name: Resolve version
        id: v
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then V="${GITHUB_REF_NAME#v}"; else V="${{ inputs.version }}"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Check the tag matches VERSION
        if: github.ref_type == 'tag'
        run: |
          [ "$(cat VERSION)" = "${{ steps.v.outputs.version }}" ] || { echo "VERSION file ($(cat VERSION)) does not match tag ${GITHUB_REF_NAME}"; exit 1; }

      - name: Test
        run: |
          composer install --no-interaction --prefer-dist
          cp .env.example .env && php artisan key:generate
          php artisan test

      - name: Build the release zip
        run: |
          rm -rf vendor
          scripts/build-release.sh "${{ steps.v.outputs.version }}"
          cd dist && sha256sum "tidemark-${{ steps.v.outputs.version }}.zip" > "tidemark-${{ steps.v.outputs.version }}.zip.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: tidemark-${{ steps.v.outputs.version }}
          path: dist/*

      - name: Publish the GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.v.outputs.version }}"
          NOTES="$(awk -v v="$V" '$0 ~ "^## \\["v"\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md)"
          [ -n "$NOTES" ] || NOTES="Release $V"
          gh release create "${GITHUB_REF_NAME}" dist/* --title "Tidemark $V" --notes "$NOTES"

  docker:
    name: Docker image
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve tags
        id: t
        run: |
          V="${GITHUB_REF_NAME#v}"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "minor=${V%.*}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.t.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.t.outputs.version }}
            ghcr.io/${{ github.repository }}:${{ steps.t.outputs.minor }}
            ghcr.io/${{ github.repository }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Privacy-first web analytics
            org.opencontainers.image.licenses=MIT
